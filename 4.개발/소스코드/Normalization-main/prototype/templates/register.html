<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">회원가입</h1>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="alert alert-danger" role="alert">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form method="POST" onsubmit="return checkPasswordMatch();">
                    <div class="mb-3">
                        <label for="username" class="form-label">사용자 이름</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                        <small id="username-availability" class="form-text"></small>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">비밀번호</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">비밀번호 확인</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        <small id="password-match" class="form-text text-danger"></small>
                    </div>
                    <div class="mb-3">
                        <label for="api_key" class="form-label">OpenAI API 키 (필수)</label>
                        <input type="password" class="form-control" id="api_key" name="api_key" required>
                    </div>
                    <button type="submit" class="btn btn-primary">가입하기</button>
                </form>
                <p class="mt-3">이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    document.getElementById('username').addEventListener('input', function() {
        const username = this.value;
        const availabilityElement = document.getElementById('username-availability');
        
        if (username.length > 0) {
            fetch('/check_username', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({username: username})
            })
            .then(response => response.json())
            .then(data => {
                if (data.available) {
                    availabilityElement.textContent = '사용 가능한 사용자 이름입니다.';
                    availabilityElement.className = 'form-text text-success';
                } else {
                    availabilityElement.textContent = '이미 사용 중인 사용자 이름입니다.';
                    availabilityElement.className = 'form-text text-danger';
                }
            });
        } else {
            availabilityElement.textContent = '';
        }
    });

    document.getElementById('password').addEventListener('input', checkPasswordMatch);
    document.getElementById('confirm_password').addEventListener('input', checkPasswordMatch);

    function checkPasswordMatch() {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        const matchElement = document.getElementById('password-match');
        const submitButton = document.querySelector('button[type="submit"]');

        if (password === confirmPassword) {
            matchElement.textContent = '';
            submitButton.disabled = false;
        } else {
            matchElement.textContent = '비밀번호가 일치하지 않습니다.';
            submitButton.disabled = true;
        }

        return password === confirmPassword;
    }
    </script>
</body>
</html>
