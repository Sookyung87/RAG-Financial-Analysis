<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설정</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">설정</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <form id="apiKeyForm" method="POST" action="{{ url_for('update_api_key') }}">
                    <div class="mb-3">
                        <label for="api_key" class="form-label">OpenAI API 키</label>
                        <input type="password" class="form-control" id="api_key" name="api_key" required>
                    </div>
                    <button type="submit" class="btn btn-primary">API 키 업데이트</button>
                </form>
                <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">홈으로 돌아가기</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
