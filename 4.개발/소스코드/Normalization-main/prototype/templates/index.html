<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캡스톤디자인</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <style>
        .chat-bubble {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .user-message {
            background-color: var(--bs-primary);
            color: var(--bs-light);
            margin-left: auto;
        }
        .bot-message {
            background-color: var(--bs-secondary);
            color: var(--bs-light);
        }
        #chat-history {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
        }
        .typing-indicator {
            display: none;
            text-align: left;
            margin-bottom: 10px;
        }
        .typing-indicator span {
            height: 10px;
            width: 10px;
            float: left;
            margin: 0 1px;
            background-color: var(--bs-light);
            display: block;
            border-radius: 50%;
            opacity: 0.4;
        }
        .typing-indicator span:nth-of-type(1) { animation: 1s blink infinite 0.3333s; }
        .typing-indicator span:nth-of-type(2) { animation: 1s blink infinite 0.6666s; }
        .typing-indicator span:nth-of-type(3) { animation: 1s blink infinite 0.9999s; }
        @keyframes blink {
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">컴파일의 정상화 캡스톤디자인</h1>
        {% if current_user.is_authenticated %}
            <p class="text-center">
                환영합니다, {{ current_user.username }}님! 
                <a href="{{ url_for('settings') }}">설정</a> | 
                <a href="{{ url_for('logout') }}">로그아웃</a>
            </p>
        {% else %}
            <p class="text-center"><a href="{{ url_for('login') }}">로그인</a> 또는 <a href="{{ url_for('register') }}">회원가입</a></p>
        {% endif %}
        <div id="chat-history" class="border rounded mb-3"></div>
        <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="input-group mb-3">
            <input type="text" id="user-input" class="form-control" placeholder="메시지를 입력하세요...">
            <button class="btn btn-primary" type="button" id="send-btn">보내기</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/chat.js"></script>
</body>
</html>
